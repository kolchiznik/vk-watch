<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Watch Party</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #181818);
            color: var(--tg-theme-text-color, #ffffff);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .controls { display: flex; gap: 8px; }
        input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #252525; color: #fff; font-size: 14px; }
        button { padding: 10px 14px; border-radius: 8px; border: none; background: var(--tg-theme-button-color, #2ea6ff); color: var(--tg-theme-button-text-color, #ffffff); font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: default; }
        video { width: 100%; max-height: 70vh; background: #000; border-radius: 10px; }
        .status { font-size: 13px; color: #aaa; }
        #videoShell { position: relative; }
        #enableSoundButton {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            z-index: 20;
            width: max-content;
            max-width: calc(100% - 32px);
            background: rgba(25, 25, 25, 0.92);
            color: #fff;
            border: 1px solid rgba(255,255,255,.35);
            box-shadow: 0 4px 16px rgba(0,0,0,.35);
        }
        #debugLog { max-height: 240px; overflow: auto; padding: 10px; background: #101010; color: #c9e6ff; border: 1px solid #444; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
    </style>
</head>
<body>
    <div class="controls">
        <input type="text" id="urlInput" placeholder="Вставьте ссылку на видео ВК">
        <button id="loadBtn" onclick="loadVideo()">Загрузить</button>
    </div>

    <div id="videoShell">
        <video id="player" controls playsinline></video>
        <button id="enableSoundButton" type="button">🔊 Включить звук (нажмите для синхронизации)</button>
    </div>

    <div class="controls">
        <button onclick="copyRoomLink()" style="flex: 1; background: #333;">🔗 Скопировать ссылку на комнату</button>
    </div>
    <div class="status" id="statusText">Подключение к комнате...</div>
    <details>
        <summary>Отладочный лог</summary>
        <pre id="debugLog" aria-live="polite">Лог пуст.</pre>
    </details>

    <script>
        // Establish WebSocket before loading or initializing media so INIT is received immediately.
        const urlParams = new URLSearchParams(window.location.search);
        const tg = window.Telegram?.WebApp;
        tg?.expand?.();
        const roomId = tg?.initDataUnsafe?.start_param || urlParams.get('room') || 'room_' + crypto.randomUUID();
        if (!urlParams.get('room')) window.history.replaceState({}, '', `?room=${encodeURIComponent(roomId)}`);

        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${location.host}/ws/${encodeURIComponent(roomId)}`);

        const player = document.getElementById('player');
        const statusText = document.getElementById('statusText');
        const debugLog = document.getElementById('debugLog');
        const enableSoundButton = document.getElementById('enableSoundButton');
        let isRemote = false;
        let isSeeking = false;
        let hls = null;
        let currentProxyUrl = '';

        function logDebug(message, details) {
            const timestamp = new Date().toLocaleTimeString();
            const suffix = details === undefined ? '' : `\n${JSON.stringify(details, null, 2)}`;
            const existing = debugLog.textContent === 'Лог пуст.' ? '' : debugLog.textContent + '\n\n';
            debugLog.textContent = `${existing}[${timestamp}] ${message}${suffix}`;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        function makeProxyUrl(streamUrl, headers = {}) {
            const params = new URLSearchParams({ url: streamUrl });
            if (headers['User-Agent']) params.set('user_agent', headers['User-Agent']);
            if (headers.Referer) params.set('referer', headers.Referer);
            return `/api/proxy?${params.toString()}`;
        }

        async function probeProxy(proxyUrl) {
            try {
                const response = await fetch(proxyUrl, { headers: { Range: 'bytes=0-0' }, cache: 'no-store' });
                logDebug('Ответ /api/proxy', {
                    status: response.status,
                    content_type: response.headers.get('Content-Type'),
                    upstream_status: response.headers.get('X-Proxy-Upstream-Status'),
                    upstream_content_type: response.headers.get('X-Proxy-Upstream-Content-Type')
                });
                await response.body?.cancel();
            } catch (error) {
                logDebug('Ошибка диагностического запроса /api/proxy', error.message);
            }
        }

        function requestSync() {
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'sync_request' }));
        }

        function tryPlayRoomMedia(targetTime, playing) {
            if (playing) {
                player.play().catch(error => {
                    if (error.name === 'NotAllowedError') {
                        player.muted = true;
                        player.play().catch(() => {});
                        enableSoundButton.style.display = 'block';
                    }
                });
            } else {
                player.pause();
            }
        }

        function synchronizeWithRoom(actualTime, playing, serverTime) {
            if (!Number.isFinite(actualTime) || isSeeking) return;
            if (Math.abs(player.currentTime - actualTime) > 1.5) {
                isRemote = true;
                player.currentTime = Math.max(0, actualTime);
                setTimeout(() => { isRemote = false; }, 300);
            }
            tryPlayRoomMedia(actualTime, playing);
            logDebug('Сверка таймкода с сервером', {
                actualTime, localTime: player.currentTime, playing, serverTime
            });
        }

        enableSoundButton.addEventListener('click', async () => {
            player.muted = false;
            enableSoundButton.style.display = 'none';
            try {
                await player.play();
            } catch (error) {
                enableSoundButton.style.display = 'block';
                logDebug('Не удалось включить звук', error.message);
            }
            requestSync();
        });

        ws.onopen = () => statusText.innerText = `Комната: ${roomId} (подключено)`;
        ws.onclose = () => statusText.innerText = 'Соединение потеряно. Перезагрузите страницу.';
        ws.onerror = () => statusText.innerText = 'Не удалось подключиться к комнате.';

        function setVideoSource(streamUrl, startTime = 0, autoPlay = false, isHls = false, headers = {}, onReady = null) {
            const targetTime = Math.max(0, Number(startTime) || 0);
            currentProxyUrl = makeProxyUrl(streamUrl, headers);
            if (hls) { hls.destroy(); hls = null; }
            player.removeAttribute('src');
            player.load();

            const useHls = Boolean(isHls || streamUrl.toLowerCase().includes('.m3u8')) && Boolean(window.Hls?.isSupported());
            logDebug(`Выбран плеер: ${useHls ? 'Hls.js' : 'нативный <video>'}`, {
                is_hls: Boolean(isHls), targetTime, stream_url: streamUrl, proxy_url: currentProxyUrl
            });
            probeProxy(currentProxyUrl);

            function startAtServerTime() {
                tryPlayRoomMedia(targetTime, autoPlay);
                if (onReady) onReady();
            }

            if (useHls) {
                hls = new Hls({
                    startPosition: targetTime,
                    maxBufferLength: 60,
                    maxMaxBufferLength: 120
                });
                hls.loadSource(currentProxyUrl);
                hls.attachMedia(player);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    // Start immediately at the target position; first FRAG_LOADED performs exact correction.
                    try {
                        isRemote = true;
                        player.currentTime = targetTime;
                    } finally {
                        setTimeout(() => { isRemote = false; }, 300);
                    }
                    tryPlayRoomMedia(targetTime, autoPlay);
                });

                let firstFragmentCorrected = false;
                hls.on(Hls.Events.FRAG_LOADED, () => {
                    if (firstFragmentCorrected) return;
                    firstFragmentCorrected = true;
                    if (!onReady) return;

                    // Recalculate from server state now that manifest and first fragment have loaded.
                    onReady();
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    logDebug('Ошибка Hls.js', {
                        type: data.type,
                        details: data.details,
                        fatal: data.fatal,
                        response: data.response ? { code: data.response.code, text: data.response.text, url: data.response.url } : null
                    });
                    if (data.fatal) statusText.innerText = 'Ошибка воспроизведения HLS-потока.';
                });
            } else {
                player.src = currentProxyUrl;
                player.onloadedmetadata = startAtServerTime;
            }
        }

        player.addEventListener('error', () => {
            const mediaError = player.error;
            logDebug('Ошибка элемента video', mediaError ? {
                code: mediaError.code,
                message: mediaError.message,
                currentSrc: player.currentSrc,
                networkState: player.networkState,
                readyState: player.readyState
            } : { message: 'Неизвестная ошибка media element' });
        });

        player.addEventListener('seeking', () => { isSeeking = true; });
        player.addEventListener('seeked', () => { setTimeout(() => { isSeeking = false; }, 150); });
        player.addEventListener('waiting', () => requestSync());

        ws.onmessage = event => {
            let msg;
            try { msg = JSON.parse(event.data); }
            catch (error) { logDebug('Некорректное сообщение WebSocket', error.message); return; }

            if (msg.type === 'init') {
                const state = msg.state;
                if (state?.stream_url) {
                    document.getElementById('urlInput').value = state.vk_url || '';
                    const serverTime = Number(msg.server_time);
                    const stateTime = Number(state.time);
                    const elapsedForInit = Number.isFinite(serverTime) ? Math.max(0, Date.now() / 1000 - serverTime) : 0;
                    const actualTime = state.playing ? stateTime + elapsedForInit : stateTime;
                    setVideoSource(state.stream_url, actualTime, state.playing, state.is_hls, state.http_headers || {}, () => {
                        synchronizeWithRoom(actualTime, state.playing, serverTime);
                    });
                }
            } else if (msg.type === 'sync') {
                const state = msg.state || msg;
                const serverTime = Number(msg.server_time);
                let actualTime = Number(state.time ?? msg.time);
                if (state.playing && Number.isFinite(serverTime)) {
                    actualTime += Math.max(0, Date.now() / 1000 - serverTime);
                }
                synchronizeWithRoom(actualTime, Boolean(state.playing), serverTime);
            } else {
                isRemote = true;
                if (msg.type === 'load') {
                    document.getElementById('urlInput').value = msg.vk_url || '';
                    statusText.innerText = `Загружено: ${msg.title || 'Видео'}`;
                    setVideoSource(msg.stream_url, 0, true, msg.is_hls, msg.http_headers || {});
                } else if (msg.type === 'play') {
                    if (Math.abs(player.currentTime - msg.time) > 1.5) player.currentTime = msg.time;
                    player.play().catch(() => {});
                } else if (msg.type === 'pause') {
                    player.currentTime = msg.time || 0;
                    player.pause();
                } else if (msg.type === 'seek') {
                    player.currentTime = msg.time || 0;
                }
                setTimeout(() => { isRemote = false; }, 300);
            }
        };

        async function loadVideo() {
            const vkUrl = document.getElementById('urlInput').value.trim();
            if (!vkUrl) return;
            const btn = document.getElementById('loadBtn');
            btn.disabled = true;
            statusText.innerText = 'Извлекаем видео...';
            try {
                const res = await fetch(`/api/extract?url=${encodeURIComponent(vkUrl)}`);
                const data = await res.json();
                logDebug('Полный ответ /api/extract', data);
                if (!res.ok) throw new Error(data.detail || 'Ошибка извлечения');

                statusText.innerText = `Загружено: ${data.title}`;
                setVideoSource(data.stream_url, 0, true, Boolean(data.is_hls), data.http_headers || {});
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'load', vk_url: vkUrl, stream_url: data.stream_url,
                        is_hls: Boolean(data.is_hls), http_headers: data.http_headers || {}, title: data.title
                    }));
                }
            } catch (error) {
                statusText.innerText = 'Ошибка: ' + error.message;
                logDebug('Ошибка загрузки/извлечения', error.message);
            } finally {
                btn.disabled = false;
            }
        }

        player.onplay = () => {
            if (!isRemote && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'play', time: player.currentTime }));
        };
        player.onpause = () => {
            if (!isRemote && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'pause', time: player.currentTime }));
        };
        player.onseeked = () => {
            if (!isSeeking && !isRemote && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'seek', time: player.currentTime }));
        };

        setInterval(() => {
            if (!isSeeking && !player.paused && ws.readyState === WebSocket.OPEN) requestSync();
        }, 5000);

        async function copyRoomLink() {
            try {
                await navigator.clipboard.writeText(window.location.href);
                statusText.innerText = 'Ссылка скопирована! Отправьте её друзьям.';
            } catch (error) {
                statusText.innerText = 'Не удалось скопировать ссылку.';
            }
        }
    </script>
</body>
</html>
